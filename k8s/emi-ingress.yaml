apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: emi-ingress
  namespace: emi
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: emi.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: emi-web
            port:
              number: 80
