apiVersion: apps/v1
kind: Deployment
metadata:
  name: emi-web
  namespace: emi
spec:
  replicas: 3
  selector:
    matchLabels:
      app: emi-web
  template:
    metadata:
      labels:
        app: emi-web
    spec:
      containers:
      - name: emi-web
        image: emi-web:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: emi-config
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
