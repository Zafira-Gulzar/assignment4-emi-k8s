<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loan EMI Calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-4">
    <h1 class="mb-4 text-center">Loan EMI Calculator</h1>
    <div class="row g-4">
      <!-- Form -->
      <div class="col-md-5">
        <div class="card shadow-sm">
          <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Calculate EMI</h5>
          </div>
          <div class="card-body">
            <form id="emiForm" novalidate>
              <div class="mb-3">
                <label class="form-label">Loan Amount (P) in PKR</label>
                <input type="number" class="form-control" id="principal" min="1" step="any" required>
                <div class="invalid-feedback">Enter a positive number.</div>
              </div>
              <div class="mb-3">
                <label class="form-label">Annual Interest Rate (%)</label>
                <input type="number" class="form-control" id="rate" min="0" step="any" required>
                <div class="invalid-feedback">Enter a non-negative number.</div>
              </div>
              <div class="mb-3">
                <label class="form-label">Tenure (months)</label>
                <input type="number" class="form-control" id="months" min="1" step="1" required>
                <div class="invalid-feedback">Enter a positive integer.</div>
              </div>
              <button type="submit" class="btn btn-primary w-100">Calculate</button>
            </form>
          </div>
        </div>
      </div>
      <!-- Result + history -->
      <div class="col-md-7">
        <div id="resultPanel" class="alert alert-success d-none"></div>
        <div class="card shadow-sm mt-3">
          <div class="card-header bg-secondary text-white">
            <h5 class="mb-0">Last 10 Calculations</h5>
          </div>
          <div class="card-body">
            <table class="table table-sm table-striped">
              <thead>
                <tr><th>P</th><th>Rate %</th><th>n</th><th>EMI</th><th>Served By</th><th>Time</th></tr>
              </thead>
              <tbody id="historyBody">
                <tr><td colspan="6" class="text-center text-muted">No calculations yet.</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
    <footer class="text-center text-muted mt-4">
      <small>DS-584 Cloud Computing - Assignment 4 - Loan EMI Calculator (v1.1 - Updated)</small>
    </footer>
  </div>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    $(function () {
      // Load history table via AJAX
      function loadHistory() {
        $.get('/api/history', function (data) {
          var $body = $('#historyBody').empty();
          if (!data || data.length === 0) {
            $body.append('<tr><td colspan="6" class="text-center text-muted">No calculations yet.</td></tr>');
            return;
          }
          data.forEach(function (d) {
            var t = new Date(d.createdAt).toLocaleString();
            $body.append(
              '<tr><td>' + d.principal + '</td><td>' + d.rate +
              '</td><td>' + d.months + '</td><td>' + d.emi.toFixed(2) +
              '</td><td>' + d.servedBy + '</td><td>' + t + '</td></tr>'
            );
          });
        }).fail(function () {
          $('#historyBody').html('<tr><td colspan="6" class="text-center text-danger">Could not load history.</td></tr>');
        });
      }

      // Client-side validation
      function isInt(v) { return typeof v === 'number' && isFinite(v) && Math.floor(v) === v; }
      function validate() {
        var p = parseFloat($('#principal').val());
        var r = parseFloat($('#rate').val());
        var n = parseInt($('#months').val(), 10);
        var ok = true;
        if (!isFinite(p) || p <= 0) { $('#principal').addClass('is-invalid'); ok = false; } else { $('#principal').removeClass('is-invalid'); }
        if (!isFinite(r) || r < 0) { $('#rate').addClass('is-invalid'); ok = false; } else { $('#rate').removeClass('is-invalid'); }
        if (!isInt(n) || n <= 0) { $('#months').addClass('is-invalid'); ok = false; } else { $('#months').removeClass('is-invalid'); }
        return ok;
      }

      // AJAX form submit (no postback)
      $('#emiForm').on('submit', function (e) {
        e.preventDefault();
        if (!validate()) return;
        $.ajax({
          url: '/api/emi',
          method: 'POST',
          contentType: 'application/json',
          data: JSON.stringify({
            principal: parseFloat($('#principal').val()),
            rate: parseFloat($('#rate').val()),
            months: parseInt($('#months').val(), 10)
          }),
          success: function (resp) {
            $('#resultPanel').removeClass('d-none alert-danger').addClass('alert-success')
              .html(
                '<strong>EMI:</strong> ' + resp.emi.toFixed(2) + ' PKR<br>' +
                '<strong>Total Payment:</strong> ' + resp.totalPayment.toFixed(2) + ' PKR<br>' +
                '<strong>Total Interest:</strong> ' + resp.totalInterest.toFixed(2) + ' PKR<br>' +
                '<strong>Served By:</strong> ' + resp.servedBy + ' (' + resp.podIp + ')'
              );
            loadHistory();
          },
          error: function (xhr) {
            var msg = (xhr.responseJSON && xhr.responseJSON.error) ? xhr.responseJSON.error : 'Request failed.';
            $('#resultPanel').removeClass('d-none alert-success').addClass('alert-danger').html(msg);
          }
        });
      });

      loadHistory();
    });
  </script>
</body>
</html>
